version: 1.0
provider:
  name: openfaas
  gateway: http://127.0.0.1:8080
functions:
  echo:
    lang: golang-middleware
    handler: ./echo
    image: docker.io/{your_dockerhub_username}/echo:latest
    labels:
      com.openfaas.scale.min: "1"
      com.openfaas.scale.max: "3"
      com.openfaas.scale.factor: "50"
      
